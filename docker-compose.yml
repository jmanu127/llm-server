version: '3.8'

services:
  llm-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemma-llm-server
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MODEL_ID=${MODEL_ID}
    volumes:
      # Mount a local host folder to store the Hugging Face model cache.
      # This ensures the ~9GB model is only downloaded once and persists
      # even if the container is stopped, deleted, or rebuilt.
      - ./hf_cache:/root/.cache/huggingface
    restart: unless-stopped
